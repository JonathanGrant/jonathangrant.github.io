# SEINFELD: "The Tick"

## ACT 1

---

### Scene 1 – Jerry's Apartment (Morning) / Stand-up Cold Open

**JERRY (to audience):**
They say time is money. On the Chicago Mercantile Exchange, one millisecond IS money. These guys are upset if light isn't traveling fast enough. Light! The fastest thing in the universe, and some guy in a fleece vest in Chicago is screaming, "C'mon, MOVE IT!" You ever try to rush light? You can't honk at light. There's no passing lane. But these people found a way to be annoyed at the speed of light. That's the pinnacle of human impatience right there. We conquered fire, we split the atom, and now we're mad at photons for being lazy.

---

### Scene 2 – Monk's Café (Morning)

*Jerry is seated in the booth, coffee in front of him. George bursts through the door, practically vibrating.*

**GEORGE:**
Jerry. JERRY.

**JERRY:**
I'm right here. You don't need to say it twice, I didn't move.

**GEORGE:**
I think I've found it. I think I've finally found it.

**JERRY:**
A personality?

**GEORGE:**
The money, Jerry. The REAL money. Not salary money. Not coupon money. Trading money.

**JERRY:**
Oh, here we go.

**GEORGE:**
Sandra—you know Sandra, the woman I've been seeing—

**JERRY:**
The one who won't let you pick the restaurant.

**GEORGE:**
She picks GREAT restaurants, that's not the point. She works at a proprietary trading firm. On the CME. Jerry, this woman made forty-eight thousand dollars before LUNCH.

**JERRY:**
Before lunch?

**GEORGE:**
Before LUNCH! She's scalping E-mini S&amp;P 500 futures. She buys, she sells, same second. Sometimes less than a second. She doesn't even HOLD anything!

**JERRY:**
So she makes forty-eight grand by essentially doing nothing.

**GEORGE:**
She does nothing VERY FAST, Jerry, and that's the key! *(pulls out phone, dials)* I'm calling her right now, she's gonna explain the whole—Sandra! Hi! Yeah. Yeah, I'm with Jerry. Listen, tell me again about the—yes. Yes, the ticks.

*George puts the phone on speaker, sets it on the table.*

**SANDRA (on phone):**
So each tick on the ES is a quarter of an index point. That's twelve dollars and fifty cents per contract.

**GEORGE:**
Twelve-fifty a TICK!

**SANDRA (on phone):**
Right. And we're capturing one, two, maybe three ticks at a time. But we're doing it hundreds of times a day with algorithms and co-located servers right next to the exchange matching engine.

**GEORGE:**
*(to Jerry, covering the phone)* Co-located servers, Jerry!

**JERRY:**
I heard her. I'm sitting right here.

**GEORGE:**
*(back to phone)* And the— the buying and selling in the same second, that's the scalping?

**SANDRA (on phone):**
That's HFT scalping. We're market-making on the bid-ask spread. We're in and out before most people even see the price change.

**GEORGE:**
*(hanging up, reverently)* Twelve-fifty a tick. Jerry, I once drove forty minutes to save twelve-fifty on a shirt!

**JERRY:**
You drove to New Jersey for that shirt.

**GEORGE:**
Exposed myself to the Turnpike AND the sales tax implications, and it's the same twelve-fifty! She makes that in a FRACTION of a second just sitting there!

**JERRY:**
But she has algorithms and servers and a firm behind her. What do you have?

**GEORGE:**
I have DESIRE, Jerry. Raw, uncut desire.

**JERRY:**
That's never worked for you in any context.

**GEORGE:**
This is different. This is NUMBERS. I'm good with numbers.

**JERRY:**
You bounced a check at a bakery last month.

**GEORGE:**
That was a timing issue!

---

### Scene 3 – Jerry's Apartment (Later that morning)

*Jerry is reading on the couch. The door BURSTS open. Kramer slides in, but this time he's pushing a hand dolly loaded with a massive decommissioned server rack. Cables are hanging off it. One blinking light is still on.*

**JERRY:**
What... is that?

**KRAMER:**
THIS, Jerry, is a Dell PowerEdge R740 server rack. Decommissioned from a hedge fund in Stamford. Guy on Craigslist. Two hundred bucks.

**JERRY:**
Why is it in my apartment?

**KRAMER:**
Because I'm becoming a high-frequency trader.

**JERRY:**
Oh, of course you are.

**KRAMER:**
See, I've been reading about this. The big boys, the real HFT firms, they use co-location. They put their servers physically CLOSE to the CME's matching engine out in Aurora, Illinois. We're talking shaving microseconds off execution time. MICROSECONDS, Jerry.

**JERRY:**
And what does that have to do with my living room?

**KRAMER:**
Well, I can't afford Aurora. But you know the Spectrum internet hub? The local routing node?

**JERRY:**
No.

**KRAMER:**
It's on 84th Street. And there is an apartment available—directly above it. DIRECTLY above it, Jerry. I've already signed the lease.

**JERRY:**
You're going to move INTO a building to be closer to a router?

**KRAMER:**
You don't understand latency. Every microsecond counts. I'm talking about jitter, Jerry. Packet jitter!

**JERRY:**
You don't even know what a packet IS.

**KRAMER:**
I know it jitters, and I don't LIKE it.

**JERRY:**
And the server rack—that's going in the new apartment?

**KRAMER:**
Well, eventually. For NOW it needs to live here while I run some tests. I need to measure my ping times.

**JERRY:**
It's not LIVING here. Things don't LIVE here. I barely live here.

**KRAMER:**
Jerry, the firms on the CME are paying MILLIONS for co-location space. I'm getting mine for sixteen hundred a month, heat included.

**JERRY:**
You're going to lose a fortune.

**KRAMER:**
*(pointing, confident)* Or I'm going to make a fortune... one microsecond at a time.

*He wheels the server rack toward Jerry's bedroom.*

**JERRY:**
That is NOT going in there!

**KRAMER:**
I need an ethernet port!

**JERRY:**
Use your OWN ethernet port!

**KRAMER:**
I don't HAVE one, that's the whole problem! *(plugging cables into Jerry's wall)* You won't even know it's here.

*The server rack makes a LOUD, persistent humming noise.*

**JERRY:**
What is that sound?

**KRAMER:**
That's the fans. Cooling the processors.

**JERRY:**
It sounds like a helicopter is landing in my apartment.

**KRAMER:**
That's the sound of MONEY, Jerry.

**JERRY:**
It's the sound of you not having money, which is different.

---

### Scene 4 – J. Peterman's Office (Afternoon)

*Peterman stands behind his desk, gazing out the window with one hand pressed against the glass. Elaine sits across from him, notepad ready.*

**PETERMAN:**
Elaine, do you know what I saw in Bruges?

**ELAINE:**
...The canals?

**PETERMAN:**
A pig farmer. Standing in a morning mist, surrounded by seven hundred head of the finest Belgian Landrace swine. I locked eyes with that man across a cobblestone courtyard, and in that moment, I saw the future of capital.

**ELAINE:**
In... a pig farmer.

**PETERMAN:**
In the PIGS, Elaine. The pension fund is being restructured. I'm moving everything into CME commodity futures. Specifically, lean hog futures. The HE contracts.

**ELAINE:**
Mr. Peterman, I don't think—

**PETERMAN:**
The pig is the most undervalued creature in global finance. Pork bellies built this country. Now lean hogs will build our retirement.

**ELAINE:**
Don't we have a financial advisor for the pension fund?

**PETERMAN:**
Gerald? I let Gerald go. He lacked vision. He kept saying words like "diversification" and "fiduciary responsibility." Boring words. Pig-less words.

**ELAINE:**
Those seem like important words.

**PETERMAN:**
I need you to monitor the account. *(he gestures to the corner of the office)* I've had a Bloomberg Terminal installed.

*Elaine turns around. There's a massive dual-screen Bloomberg Terminal on a desk, glowing with dense columns of green and amber data, numbers scrolling everywhere.*

**ELAINE:**
Oh my God.

**PETERMAN:**
Beautiful, isn't it?

**ELAINE:**
*(walking toward it, horrified)* It's like the Matrix... but with pork.

**PETERMAN:**
I need you to watch the hog spreads, Elaine. Track the front-month contract. Report back to me with daily P&amp;L.

**ELAINE:**
Mr. Peterman, I don't know what ANY of this means. What's— *(squinting at screen)* —what's "HEQ24 last 89.425"?

**PETERMAN:**
That, Elaine, is the heartbeat of the American hog.

**ELAINE:**
That doesn't help me.

**PETERMAN:**
Feel it. Don't read it. FEEL it.

*Peterman exits. Elaine stares at the Bloomberg Terminal. She tentatively presses a key. An entire new screen of incomprehensible data appears.*

**ELAINE:**
*(quietly, to herself)* I went to Tufts for this.

---

**[END OF ACT 1]**

# SEINFELD: "The Tick"

## ACT 2

---

### Scene 5 – Sandra's Trading Floor (Midday)

*George stands in the middle of a sleek, open-plan trading floor. Rows of desks with multiple monitors. Traders in casual clothes, headsets on, barely moving. The room is quiet except for the soft clicking of keyboards and an occasional murmur. George is overdressed in a sport coat.*

**GEORGE:**
*(whispering to Sandra)* Why is it so quiet? I thought there'd be screaming. Guys in colored jackets, throwing paper.

**SANDRA:**
That was the pit. The pits closed. Everything's electronic now. Globex.

**GEORGE:**
So nobody yells?

**SANDRA:**
Kyle yells sometimes.

**KYLE (from across the room, not looking up):**
I yell when the fill is garbage.

**SANDRA:**
*(pointing at a screen)* Okay. See this? This is the order book. Level II data. This ladder shows every resting bid and ask on the ES.

**GEORGE:**
*(leaning in)* All these numbers on the left, those are...

**SANDRA:**
Bids. Buyers waiting. And on the right, asks. Sellers waiting. We're a market-making operation. We buy at the bid, sell at the ask, and capture the spread between them.

**GEORGE:**
So right now the bid is 4500.25, and the ask is 4500.50.

**SANDRA:**
That's the spread. One tick. We buy at the twenty-five, sell at the fifty. Twelve-fifty profit per contract, before commissions.

**GEORGE:**
And you do this all day.

**SANDRA:**
Thousands of times. Watch Danny.

*They both look at a trader two desks away. Danny clicks twice, stares at the screen, clicks again.*

Not anymore. Because now I'm not trading. The CODE is trading. And the code doesn't have an ego.

**JERRY:**
The code was written by your ego.

**GEORGE:**
The code was written by a fourteen-year-old named Rajesh who has never experienced emotional pain. It's CLEAN code, Jerry. Unsentimental.

*(He presses Enter. The screen flashes. A stream of data begins scrolling.)*

**GEORGE:**
It's live. One lot ES on Globex. The algorithm is watching the twenty-period VWAP on the one-minute chart. When price deviates far enough from the mean, it fades the move. Buys the dip, sells the rip, captures the reversion.

**JERRY:**
And you're sure it works.

**GEORGE:**
Backtested. Sixty-two percent win rate. I showed you the numbers.

**JERRY:**
You showed me a spreadsheet with yellow highlighting.

**GEORGE:**
That's how professionals present data.

*(A ding from the laptop.)*

**GEORGE:**
It just took its first trade. Short one ES at 4508.75.

*(They both lean in. A few seconds pass. Another ding.)*

**GEORGE:**
Covered at 4508.50. One tick. Twelve dollars and fifty cents minus the round-trip commission of four-fifty. Net eight dollars.

**JERRY:**
Eight dollars.

**GEORGE:**
In four SECONDS, Jerry.

**JERRY:**
You spent two hundred dollars and three weeks to make eight dollars in four seconds.

**GEORGE:**
It's SCALABLE. Watch.

*(Three more dings in quick succession.)*

**GEORGE:**
Three more fills. All winners. One tick, one tick, two ticks. That's... *(counting on fingers)* ...thirty-two dollars net.

**JERRY:**
We're rich.

**GEORGE:**
In twenty minutes it'll be a hundred. In an hour, four hundred. I'm going to the movies. I'm going to sit in a dark theater and watch something with subtitles and when I come out I'll have made more money than I made last WEEK at my actual job.

*(He stands, buttons his sport coat, and heads for the door.)*

**JERRY:**
You're really just going to leave it running.

**GEORGE:**
That is literally the point of automation. If I sit here and watch, I'll INTERFERE. I'll second-guess. I'll override. I need to be AWAY from it. The machine works. I just need to let the machine work.

**JERRY:**
What if something unexpected happens? Some kind of news event?

**GEORGE:**
Like what? What's going to happen on a random Wednesday morning?

**JERRY:**
I don't know. That's what "unexpected" means.

**GEORGE:**
Nothing's going to happen. I'll be back by two.

*(He exits. Jerry looks at the laptop. The screen scrolls. Another ding. He looks away, eats cereal. Another ding. He glances back. Looks at the numbers. Nods slowly. Goes back to his cereal.)*

### SCENE 15 – PETERMAN'S OFFICE (DAY)

*(Elaine bursts through Peterman's door. He is on the phone, speaking what might be Flemish.)*

**PETERMAN:**
*(into phone)*
...en dat is waarom het varken de toekomst is. Tot ziens.

*(He hangs up.)*

**ELAINE:**
Mr. Peterman, we have three hours until the margin call deadline. The broker is going to LIQUIDATE our entire position at market if we don't either deposit sixty thousand dollars or close the trades ourselves.

**PETERMAN:**
Liquidate. Such an ugly word. Like something you'd do to a failed soup.

**ELAINE:**
It IS ugly! They will sell all eighty contracts at whatever price is available, which right now would lock in a loss of approximately a hundred and eighty-six thousand dollars of PENSION money!

**PETERMAN:**
Or.

**ELAINE:**
Or?

**PETERMAN:**
Or the hog turns. The hog ALWAYS turns, Elaine.

**ELAINE:**
The hog has NOT turned! The hog has done the OPPOSITE of turning! The hog has gone in a straight line in the wrong direction for ELEVEN DAYS!

**PETERMAN:**
I spoke with a contact at the CME this morning.

**ELAINE:**
You have a contact at the CME?

**PETERMAN:**
A man I met at a leather goods expo in Antwerp. He tells me there's a way to extend our position without taking settlement. We ROLL it.

**ELAINE:**
Roll it.

**PETERMAN:**
We sell the expiring April contract and simultaneously buy the June contract. We move the whole position forward in time. First Notice Day becomes irrelevant.

**ELAINE:**
*(pausing)*
That's... actually the correct thing to do.

**PETERMAN:**
Elaine, I didn't build a catalog empire by being incorrect. I built it by being correct at unusual times.

**ELAINE:**
But we're still down a hundred and eighty-six thousand dollars. Rolling doesn't fix the LOSS, it just pushes the expiration.

**PETERMAN:**
It gives the pig time to WALLOW. To rise. I'm authorizing the roll. All eighty contracts. April to June.

**ELAINE:**
Fine. Fine! But AFTER the roll, I want authorization to close the position entirely. Cut our losses. Walk away. We're down a hundred and eighty-six thousand on a PIG HUNCH.

**PETERMAN:**
We'll roll. And then we'll see what June brings.

**ELAINE:**
Mr. Peterman—

**PETERMAN:**
The pig farmer in Bruges had a saying. "Het varken kent geen haast."

**ELAINE:**
Which means?

**PETERMAN:**
"The pig knows no haste."

**ELAINE:**
GREAT. The pig is PATIENT. We are not patient! We are a CATALOG COMPANY with a pension fund that is currently long three point two million pounds of notional pork!

**PETERMAN:**
*(picking up the phone, dialing)*
I'm calling the broker now. We roll to June. And Elaine—

**ELAINE:**
What.

**PETERMAN:**
—have a little faith in the hog.

*(Elaine exits into the hallway. Presses her back against the wall. Her phone buzzes. She answers.)*

**ELAINE:**
*(into phone)*
Hello? Yes, this is— he's calling you right now to authorize the roll. April to June. All eighty contracts. And I need you to know that the SECOND that roll is complete, I'm going to call you back every single hour until I get authorization to flatten the entire thing. I don't care if— how much slippage on the roll? How many ticks?

*(She listens. Her face falls.)*

**ELAINE:**
Three ticks of calendar spread slippage? On eighty contracts? What's that in dollars?

*(She listens.)*

**ELAINE:**
Forty-eight hundred dollars just to ROLL it? We lose forty-eight hundred dollars to move from one month to the NEXT month?

*(She listens.)*

**ELAINE:**
Yes. Yes, execute the roll. And I'm going to need a drink.

### SCENE 16 – JERRY'S APARTMENT (AFTERNOON)

*(Jerry is on the couch. The laptop is still on the counter, still scrolling. Occasional dings. Kramer enters wearing the "CME GROUP" lanyard he got from a conference.)*

**KRAMER:**
How's George's robot doing?

**JERRY:**
It keeps making these little dings. I think it's winning. It's kind of pleasant, actually. Like a slot machine that only gives you quarters.

*(Kramer walks over and looks at the screen.)*

**KRAMER:**
Net P&amp;L... sixty-four dollars. Eight winning scalps. Nice. Real nice.

**JERRY:**
He went to the movies.

**KRAMER:**
That's discipline. Let the machine work. Don't interfere. I respect it.

*(Jerry's phone rings. He answers.)*

**JERRY:**
Hello? Yeah, he's— well, he's at the movies. This is his... this is where the computer is. Who is this?

*(He listens. His face changes.)*

**JERRY:**
What do you mean "emergency rate statement"?

*(Kramer's head snaps toward Jerry.)*

**KRAMER:**
What? WHAT?

**JERRY:**
*(to Kramer, covering phone)*
Someone named Rajesh says the Federal Reserve just released an emergency FOMC statement.

**KRAMER:**
*(lunging for the laptop)*
Oh no. Oh no no no—

*(The laptop starts dinging rapidly. Not pleasant dings anymore. Urgent, cascading dings. The scrolling accelerates.)*

**KRAMER:**
The ES just dropped eight points! Twelve points! George's algo is BUYING, Jerry! It sees every drop as a deviation from the VWAP so it keeps buying the dip!

**JERRY:**
*(into phone)*
Rajesh? Rajesh, how do we stop it?

**KRAMER:**
It's down twenty points now! Twenty-five! The algo is adding! It bought another lot!

**JERRY:**
*(into phone)*
There's no kill switch?! What do you mean there's no— he told you not to ADD one?!

**KRAMER:**
Thirty points! Jerry, at one lot that's— that's fifteen hundred dollars and it's still GOING!

*(Jerry grabs the laptop. He does the only thing he can think of. He closes the lid. They both stare at the closed laptop.)*

**KRAMER:**
...did that work?

*(A muffled ding from inside the closed laptop.)*

**JERRY:**
That didn't work.

**KRAMER:**
Closing the laptop doesn't close the POSITION, Jerry! The order is on the exchange! The exchange doesn't know the laptop is closed! The exchange doesn't CARE about the laptop!

**JERRY:**
WELL WHAT DO I DO?!

**KRAMER:**
Open it! OPEN IT!

*(Jerry opens the laptop. The screen shows the P&amp;L plummeting.)*

**KRAMER:**
It's down forty points now. That's two thousand on the one lot and— oh. Oh, it bought ANOTHER lot. On that last dip. It's reverted to its mean reversion logic and decided EVERYTHING is a dip.

**JERRY:**
Can YOU stop it?

**KRAMER:**
I trade Micro Nasdaqs! This is the full ES! This is the big leagues! I don't even know what platform—

*(The door bursts open. George stands there, wild-eyed, holding a movie theater popcorn.)*

**GEORGE:**
WHAT HAPPENED?! Rajesh texted me! He texted me IN THE THEATER!

**JERRY:**
The Federal Reserve released an emergency statement and your algorithm has been buying every dip for the last six minutes!

**GEORGE:**
*(shoving past Kramer, staring at screen)*
It's down... twenty-two hundred dollars?! It was UP sixty-four! I was gone for NINETY MINUTES!

**KRAMER:**
And it bought a second lot on the way down! You're holding two ES long in a freefall!

**GEORGE:**
HOW DO I STOP IT?!

**JERRY:**
I closed the laptop!

**GEORGE:**
Why did you close the LAPTOP?!

**JERRY:**
I panicked! What was I supposed to do, REASON with it?!

**GEORGE:**
Closing the laptop doesn't stop the trade! The order lives on the Globex matching engine! The laptop is just a WINDOW!

**JERRY:**
You know shutting the laptop doesn't stop the trade, right?

**GEORGE:**
IT SHOULD! THERE SHOULD BE A LID RULE! THERE SHOULD BE A FEDERAL REGULATION THAT WHEN THE LID IS CLOSED, THE TRADE IS DONE!

*(He frantically clicks, trying to flatten the position.)*

**GEORGE:**
Where's the flatten— where's the— KRAMER, where's the FLATTEN BUTTON?!

**KRAMER:**
It's the red one! The RED ONE!

*(George clicks. A beat. The dinging stops. Silence.)*

**GEORGE:**
*(reading the screen)*
...I'm out. Position closed.

**JERRY:**
How bad?

**GEORGE:**
*(quietly)*
Eighteen hundred. No... wait. Twenty-two hundred. It filled another lot while I was clicking. It bought a THIRD contract on the way down and I closed all three at the bottom.

**KRAMER:**
Buy high, sell low. Three times in a row.

**GEORGE:**
*(staring at the screen)*
I made sixty-four dollars in twenty minutes. And I lost twenty-two hundred dollars in six minutes. Because I went to go see a MOVIE.

**JERRY:**
What movie?

**GEORGE:**
I don't know! Something French! I couldn't focus after the third text from Rajesh!

**JERRY:**
So you lost twenty-two hundred dollars and you don't even know how the movie ends.

**GEORGE:**
*(slamming the laptop shut, then immediately opening it again)*
The lid doesn't matter. NOTHING about the lid matters.

*(He slumps onto the couch between Jerry and Kramer. Long silence.)*

**GEORGE:**
...I still think the mean reversion logic was sound.

**JERRY:**
Let it go, George.

**GEORGE:**
In a NORMAL market—

**JERRY:**
Let it go.

### SCENE 17 – MONK'S CAFÉ (EVENING) – FINAL SCENE

*(All four at the booth. George has his head in his hands. Elaine is on her third bourbon—actual glass visible. Kramer is wearing the CME GROUP lanyard and examining his "SELL???" napkin. Jerry surveys the wreckage.)*

**JERRY:**
So let me get this straight. George lost twenty-two hundred dollars to a computer he built himself.

**GEORGE:**
Co-built.

**JERRY:**
Co-built with a fourteen-year-old.

**GEORGE:**
He's very mature for his age.

**JERRY:**
Elaine lost ninety-four thousand dollars on imaginary pigs.

**ELAINE:**
They're not imaginary. They're CASH-SETTLED. There's a difference. The pigs are REAL. The settlement is abstract.

**JERRY:**
And Peterman let you close it?

**ELAINE:**
He called it "tuition in the University of Pork." He wants to frame the trade confirmation. He's going to hang it in his office next to the photo of the pig farmer from Bruges.

**JERRY:**
Ninety-four thousand dollars.

**ELAINE:**
*(lifting her glass)*
Tufts.

**JERRY:**
And Kramer got investigated by the federal government for a total of three hundred and forty-seven dollars.

**KRAMER:**
Three hundred and forty-seven dollars and EXPERIENCE, Jerry. And I was CLEARED. Fully exonerated.

**JERRY:**
They didn't exonerate you. They couldn't figure out what to CHARGE you with.

**KRAMER:**
A technicality in my favor.

*(Silence. George lifts his head.)*

**GEORGE:**
...I still think my delta divergence read was right.

*(Everyone ignores him. Elaine drinks. Kramer studies his napkin. Jerry shakes his head.)*

**GEORGE:**
The cumulative delta was FALLING while price was making new highs. That's absorption. That's a REAL signal. I just— the execution was—

**JERRY:**
George.

**GEORGE:**
—if I had taken the four ticks—

**JERRY:**
George.

**GEORGE:**
—I'd be UP, Jerry. I'd be up five hundred dollars and Sandra would still be—

**ELAINE:**
Sandra dumped you?

**GEORGE:**
I don't want to talk about it.

<script>
(function() {
  'use strict';

  // ---- Helpers ----
  function decodeEntities(text) {
    var el = document.createElement('textarea');
    el.innerHTML = text;
    return el.value;
  }

  function getRawText(id) {
    return decodeEntities(document.getElementById(id).textContent.trim());
  }

  // ---- Script parser ----
  function parseScript(raw) {
    var lines = raw.split('\n');
    var html = '';
    var sceneCount = 0;
    var actCount = 0;
    var scenes = []; // {id, label, actLabel}
    var currentAct = '';

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var trimmed = line.trim();

      // Skip empty lines
      if (trimmed === '') {
        continue;
      }

      // Skip --- START/END markers
      if (/^---\s*(START OF ACT|END OF ACT|END OF EPISODE)/i.test(trimmed)) {
        continue;
      }

      // Divider line: just ---
      if (/^---+$/.test(trimmed)) {
        html += '<hr class="divider">';
        continue;
      }

      // Episode title: # TITLE
      if (/^#\s+[^#]/.test(trimmed)) {
        var titleText = trimmed.replace(/^#\s+/, '');
        html += '<h1 class="episode-heading">' + escapeHtml(titleText) + '</h1>';
        continue;
      }

      // Act heading: ## ACT X
      if (/^##\s+[^#]/.test(trimmed)) {
        actCount++;
        currentAct = trimmed.replace(/^##\s+/, '');
        var actId = 'act-' + actCount;
        html += '<h2 class="act-heading" id="' + actId + '" data-act="' + actCount + '">' + escapeHtml(currentAct) + '</h2>';
        continue;
      }

      // Scene heading: ### SCENE X
      if (/^###\s+/.test(trimmed)) {
        sceneCount++;
        var sceneText = trimmed.replace(/^###\s+/, '');
        var sceneId = 'scene-' + sceneCount;
        html += '<h3 class="scene-heading" id="' + sceneId + '">' + escapeHtml(sceneText) + '</h3>';
        scenes.push({ id: sceneId, label: sceneText, actLabel: currentAct });
        continue;
      }

      // Character name: **NAME:** or **NAME (direction):** or **NAME** *(direction)*:
      var charMatch = trimmed.match(/^\*\*([^*]+?)\*\*\s*(.*)/);
      if (charMatch) {
        var charName = charMatch[1].trim();
        var rest = charMatch[2].trim();

        // Remove trailing colon from charName
        charName = charName.replace(/:$/, '');

        html += '<div class="character-name">' + escapeHtml(charName) + '</div>';

        // If there's remaining text after the character name, render as dialogue
        if (rest) {
          rest = rest.replace(/^:\s*/, '');
          if (rest) {
            html += '<div class="dialogue">' + formatInline(rest) + '</div>';
          }
        }
        continue;
      }

      // Full line of stage direction: starts with *( and ends with )* or starts/ends with *
      if (/^\*\(/.test(trimmed) && /\)\*$/.test(trimmed)) {
        var sdText = trimmed.slice(2, -2); // Remove *( and )*
        html += '<div class="stage-direction">(' + escapeHtml(sdText) + ')</div>';
        continue;
      }

      if (/^\*[^*]/.test(trimmed) && /[^*]\*$/.test(trimmed) && !trimmed.startsWith('**')) {
        var dirText = trimmed.slice(1, -1);
        html += '<div class="stage-direction">' + escapeHtml(dirText) + '</div>';
        continue;
      }

      // Fallback: dialogue text
      html += '<div class="dialogue">' + formatInline(trimmed) + '</div>';
    }

    return { html: html, scenes: scenes, actCount: actCount };
  }

  function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatInline(text) {
    var s = escapeHtml(text);
    // Convert **bold** to <strong>
    s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
    // Convert *italic* to styled spans
    s = s.replace(/\*([^*]+?)\*/g, '<span class="inline-italic">$1</span>');
    return s;
  }

  // ---- Render scripts ----
  var scripts = {
    draft1: parseScript(getRawText('raw-draft1')),
    draft2: parseScript(getRawText('raw-draft2')),
    final:  parseScript(getRawText('raw-final'))
  };

  document.getElementById('panel-draft1').innerHTML = scripts.draft1.html;
  document.getElementById('panel-draft2').innerHTML = scripts.draft2.html;
  document.getElementById('panel-final').innerHTML = scripts.final.html;

  // ---- Tab switching ----
  var currentTab = 'draft1';

  window.switchTab = function(tab) {
    if (tab === currentTab) return;
    currentTab = tab;

    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
    });

    document.querySelectorAll('.script-panel').forEach(function(p) {
      p.classList.remove('active');
    });
    document.getElementById('panel-' + tab).classList.add('active');

    window.scrollTo({ top: 0 });

    buildActIndicator();
    buildNav();
  };

  // ---- Act indicator (sidebar dots) ----
  function buildActIndicator() {
    var container = document.getElementById('actIndicator');
    var panel = document.getElementById('panel-' + currentTab);
    var acts = panel.querySelectorAll('.act-heading');
    container.innerHTML = '';
    acts.forEach(function(_, idx) {
      var dot = document.createElement('div');
      dot.className = 'act-dot';
      dot.dataset.actIdx = idx;
      dot.title = 'Act ' + (idx + 1);
      container.appendChild(dot);
    });
    observeActs();
  }

  var actObserver = null;

  function observeActs() {
    if (actObserver) actObserver.disconnect();
    var panel = document.getElementById('panel-' + currentTab);
    var acts = panel.querySelectorAll('.act-heading');
    if (acts.length === 0) return;

    var dots = document.querySelectorAll('.act-dot');

    actObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var actIdx = Array.from(acts).indexOf(entry.target);
          dots.forEach(function(d, i) {
            d.classList.toggle('active', i === actIdx);
          });
        }
      });
    }, {
      rootMargin: '-30% 0px -60% 0px',
      threshold: 0
    });

    acts.forEach(function(a) { actObserver.observe(a); });
  }

  // ---- Scene navigator ----
  function buildNav() {
    var data = scripts[currentTab];
    var body = document.getElementById('navBody');
    body.innerHTML = '';
    var lastAct = '';
    data.scenes.forEach(function(s) {
      if (s.actLabel !== lastAct) {
        lastAct = s.actLabel;
        var title = document.createElement('div');
        title.className = 'nav-section-title';
        title.textContent = lastAct;
        body.appendChild(title);
      }
      var btn = document.createElement('button');
      btn.className = 'nav-scene-btn';
      btn.textContent = s.label;
      btn.onclick = function() {
        closeNav();
        var el = document.getElementById(s.id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };
      body.appendChild(btn);
    });
  }

  window.openNav = function() {
    buildNav();
    document.getElementById('navModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  window.closeNav = function() {
    document.getElementById('navModal').classList.remove('open');
    document.body.style.overflow = '';
  };

  window.closeNavIfOverlay = function(e) {
    if (e.target === document.getElementById('navModal')) {
      closeNav();
    }
  };

  // Escape key closes modal
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeNav();
  });

  // ---- Scroll to top button ----
  var scrollTopBtn = document.getElementById('scrollTop');
  window.addEventListener('scroll', function() {
    scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
  });

  // ---- Init ----
  buildActIndicator();
  buildNav();
})();
</script>
</body>
